[workspace]
resolver = "2"
members = [
    "crates/animation",
    "crates/audio-dsp",
    "crates/composition",
    "crates/core",
    "crates/media",
    "crates/player",
    "crates/renderer",
    "crates/transitions",
    "crates/cli",
    "crates/shapes",
    "crates/paths",
    "crates/captions",
    "crates/noise",
    "crates/rasterizer",
    "crates/vdom",
    "crates/charts",
    "crates/python",
    "crates/project",
    "apps/studio",
    "apps/example",
]


[workspace.package]
version      = "1.0.0"
edition      = "2021"

authors      = ["Rust Motion Contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/sjkim1127/rust-motion"
readme       = "README.md"

[workspace.dependencies]
# UI framework
dioxus            = { version = "0.6", default-features = false, features = ["macro", "hooks", "signals", "html", "document", "launch"] }
dioxus-web        = { version = "0.6" }
dioxus-desktop    = { version = "0.6" }
dioxus-core       = { version = "0.6" }

# Async runtime
tokio             = { version = "1", features = ["full"] }
futures           = "0.3"

# Serialization
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
rhai              = { version = "1.25", features = ["serde", "sync"] }

# Logging
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math / utilities
ordered-float     = "4"
num-traits        = "0.2"
base64            = "0.22"
urlencoding       = "2.1"

# Image / rasterizer
image             = "0.25"
tiny-skia         = "0.11"
resvg             = { version = "0.45", default-features = false }
ab_glyph          = "0.2"
rustybuzz         = "0.20.1"
unicode-bidi      = "0.3"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
taffy             = "0.12.2"
lyon_tessellation = "1.0.20"

# Audio decoding
hound             = "3.5"
symphonia         = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "aac", "isomp4", "pcm"] }

# Error handling
anyhow            = "1"
thiserror         = "1"
sha2              = "0.10"
tempfile          = "3"

# Parallelism
rayon             = "1"

# Web server & HTTP
axum              = { version = "0.7", features = ["ws"] }
tower-http        = { version = "0.5", features = ["fs", "trace", "cors"] }
reqwest           = { version = "0.12", features = ["json", "blocking"] }

# Internal crates
rust-motion-animation   = { version = "1.0.0", path = "crates/animation" }
rust-motion-audio-dsp   = { version = "1.0.0", path = "crates/audio-dsp" }
rust-motion-cli         = { version = "1.0.0", path = "crates/cli" }
rust-motion-composition = { version = "1.0.0", path = "crates/composition" }
rust-motion-core        = { version = "1.0.0", path = "crates/core" }
rust-motion-media       = { version = "1.0.0", path = "crates/media", default-features = false }
rust-motion-player      = { version = "1.0.0", path = "crates/player" }
rust-motion-renderer    = { version = "1.0.0", path = "crates/renderer" }
rust-motion-transitions = { version = "1.0.0", path = "crates/transitions" }
rust-motion-shapes      = { version = "1.0.0", path = "crates/shapes", default-features = false }
rust-motion-paths       = { version = "1.0.0", path = "crates/paths" }
rust-motion-captions    = { version = "1.0.0", path = "crates/captions", default-features = false }
rust-motion-noise       = { version = "1.0.0", path = "crates/noise" }
rust-motion-rasterizer  = { version = "1.0.0", path = "crates/rasterizer" }
rust-motion-vdom        = { version = "1.0.0", path = "crates/vdom" }
rust-motion-charts      = { version = "1.0.0", path = "crates/charts" }
rust-motion-project     = { version = "1.0.0", path = "crates/project" }





[profile.release]
opt-level  = 3
lto        = true
codegen-units = 1
strip      = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
