[package]
name        = "example"
description = "Rust Motion Hello World example composition"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
publish               = false

[[bin]]
name = "example"
path = "src/main.rs"

[dependencies]
dioxus              = { workspace = true }
dioxus-web          = { workspace = true }
rust-motion-core      = { workspace = true }
rust-motion-animation = { workspace = true }
rust-motion-player    = { workspace = true }
rust-motion-transitions = { workspace = true }
rust-motion-shapes      = { workspace = true, features = ["dioxus"] }
tracing-subscriber  = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }

[features]
default = []
web     = ["dioxus/web", "rust-motion-core/web"]
desktop = ["dioxus/desktop", "rust-motion-core/desktop"]
