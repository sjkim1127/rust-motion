<!doctype html>
<html>
  <body>
    <canvas id="render-target" width="4" height="2"></canvas>
    <script>
      window.rust-motion = {
        async renderFrame(request) {
          const canvas = document.querySelector('#render-target');
          canvas.width = request.width;
          canvas.height = request.height;
          const context = canvas.getContext('2d');
          const image = context.createImageData(canvas.width, canvas.height);
          for (let y = 0; y < canvas.height; y += 1) {
            for (let x = 0; x < canvas.width; x += 1) {
              const offset = (y * canvas.width + x) * 4;
              image.data[offset] = x < canvas.width / 2 ? 255 : 0;
              image.data[offset + 1] = y < canvas.height / 2 ? 255 : 0;
              image.data[offset + 2] = request.frame & 1 ? 255 : 0;
              image.data[offset + 3] = 255;
            }
          }
          context.putImageData(image, 0, 0);
          if (typeof VideoEncoder !== 'function' || typeof VideoDecoder !== 'function') return;
          const encoded = [];
          const encoder = new VideoEncoder({
            output(chunk) {
              const data = new Uint8Array(chunk.byteLength);
              chunk.copyTo(data);
              encoded.push({ data, timestamp: chunk.timestamp, type: chunk.type });
            },
            error(error) { throw error; },
          });
          encoder.configure({ codec: 'vp8', width: canvas.width, height: canvas.height, framerate: 30 });
          const input = new VideoFrame(canvas, { timestamp: request.frame * 33333 });
          encoder.encode(input, { keyFrame: true });
          input.close();
          await encoder.flush();
          encoder.close();
          await new Promise((resolve, reject) => {
            const decoder = new VideoDecoder({
              output(frame) {
                try {
                  context.drawImage(frame, 0, 0, canvas.width, canvas.height);
                  frame.close();
                  resolve();
                } catch (error) { reject(error); }
              },
              error: reject,
            });
            decoder.configure({ codec: 'vp8', codedWidth: canvas.width, codedHeight: canvas.height });
            for (const chunk of encoded) {
              decoder.decode(new EncodedVideoChunk(chunk));
            }
            decoder.flush().then(() => decoder.close(), reject);
          });
        },
        listCompositions() { return ['roundtrip']; },
      };
    </script>
  </body>
</html>
