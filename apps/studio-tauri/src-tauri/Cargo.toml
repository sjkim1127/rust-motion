[package]
name = "rust-motion-studio-tauri"
version.workspace = true
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rust-motion-composition = { workspace = true }
rust-motion-rasterizer = { workspace = true }
rust-motion-project = { workspace = true }
rust-motion-cli = { workspace = true }
rust-motion-renderer = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
gpu = ["rust-motion-cli/gpu", "rust-motion-rasterizer/gpu"]
