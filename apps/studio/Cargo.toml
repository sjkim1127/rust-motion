[package]
name        = "studio"
description = "Rust Motion Studio — desktop video editor application"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
publish               = false

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
dioxus              = { workspace = true }
dioxus-desktop      = { workspace = true }
rust-motion-cli       = { workspace = true }
rust-motion-composition = { workspace = true }
rust-motion-core      = { workspace = true }
rust-motion-animation = { workspace = true }
rust-motion-player    = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
rust-motion-renderer  = { workspace = true }
tokio               = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
anyhow              = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "rust-motion-core/desktop"]
