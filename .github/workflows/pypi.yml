name: CI & PyPI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: pypi-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.0, got: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fxq "$RELEASE_TAG"; then
            echo "The requested tag does not point at the checked out commit: $RELEASE_TAG" >&2
            exit 1
          fi

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [validate_tag]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
          manylinux: ${{ matrix.platform.manylinux }}
          before-script-linux: |
            set -euo pipefail
            if [[ "${{ matrix.platform.target }}" == "x86_64-unknown-linux-gnu" ]]; then
              yum install -y openssl11-devel
              ln -sf /usr/lib64/pkgconfig/openssl11.pc /usr/lib64/pkgconfig/openssl.pc
              ln -sf /usr/lib64/pkgconfig/libssl11.pc /usr/lib64/pkgconfig/libssl.pc
              ln -sf /usr/lib64/pkgconfig/libcrypto11.pc /usr/lib64/pkgconfig/libcrypto.pc
            else
              (
                cd /tmp
                DEBIAN_MIRROR="https://snapshot.debian.org/archive/debian/20231003T205808Z/pool/main/o/openssl"
                LIBSSL_DEB="libssl1.1_1.1.1w-0+deb11u1_arm64.deb"
                LIBSSL_SHA256="fe7a7d313c87e46e62e614a07137e4a476a79fc9e5aab7b23e8235211280fee3"
                LIBSSL_DEV_DEB="libssl-dev_1.1.1w-0+deb11u1_arm64.deb"
                LIBSSL_DEV_SHA256="6223f761bd4b961aa0c7c1662a6e99ab31150a1a7e6529d440428b361a9c8c4a"

                curl --fail --location --show-error --silent --output "$LIBSSL_DEB" "$DEBIAN_MIRROR/$LIBSSL_DEB"
                curl --fail --location --show-error --silent --output "$LIBSSL_DEV_DEB" "$DEBIAN_MIRROR/$LIBSSL_DEV_DEB"
                printf '%s %s\n' "$LIBSSL_SHA256" "$LIBSSL_DEB" | sha256sum -c -
                printf '%s %s\n' "$LIBSSL_DEV_SHA256" "$LIBSSL_DEV_DEB" | sha256sum -c -

                for deb in *.deb; do
                  ar x "$deb"
                  tar xf data.tar.*
                  rm -f debian-binary control.tar.* data.tar.*
                done

                TARGET_DIR="/usr/aarch64-unknown-linux-gnu"
                mkdir -p "$TARGET_DIR/include/openssl" "$TARGET_DIR/lib"
                cp -r usr/include/openssl/* "$TARGET_DIR/include/openssl/"
                cp -f usr/include/aarch64-linux-gnu/openssl/configuration.h "$TARGET_DIR/include/openssl/" || true
                cp -f usr/include/aarch64-linux-gnu/openssl/opensslconf.h "$TARGET_DIR/include/openssl/" || true
                cp -a usr/lib/aarch64-linux-gnu/libssl* "$TARGET_DIR/lib/"
                cp -a usr/lib/aarch64-linux-gnu/libcrypto* "$TARGET_DIR/lib/"

                test -f "$TARGET_DIR/include/openssl/opensslv.h"
                test -f "$TARGET_DIR/include/openssl/opensslconf.h"
                test -f "$TARGET_DIR/lib/libssl.a"
              )
            fi
      - name: Install FFmpeg (Linux)
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Checkout Python smoke test harness
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          path: smoke-tests
      - name: Smoke test wheel (x86_64 native)
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        env:
          RUST_MOTION_TEST_OUTPUT_DIR: ${{ runner.temp }}/rust-motion-python-smoke
        run: |
          pip install dist/*.whl
          python3 smoke-tests/crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: [validate_tag]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
      - name: Install FFmpeg (macOS)
        if: matrix.platform.target == 'aarch64-apple-darwin'
        run: brew install ffmpeg
      - name: Checkout Python smoke test harness
        if: matrix.platform.target == 'aarch64-apple-darwin'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          path: smoke-tests
      - name: Smoke test wheel (Apple Silicon native)
        if: matrix.platform.target == 'aarch64-apple-darwin'
        env:
          RUST_MOTION_TEST_OUTPUT_DIR: ${{ runner.temp }}/rust-motion-python-smoke
        run: |
          pip install dist/*.whl
          python3 smoke-tests/crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: [validate_tag]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/python/Cargo.toml
          sccache: 'true'
      - name: Install FFmpeg (Windows)
        run: choco install ffmpeg -y
      - name: Checkout Python smoke test harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          path: smoke-tests
      - name: Smoke test wheel (x64 native)
        shell: bash
        env:
          PYTHONUTF8: '1'
          RUST_MOTION_TEST_OUTPUT_DIR: ${{ runner.temp }}/rust-motion-python-smoke
        run: |
          pip install dist/*.whl
          python smoke-tests/crates/python/tests/test_binding.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: [validate_tag]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [validate_tag, linux, macos, windows, sdist]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
