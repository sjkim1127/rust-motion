name: Benchmark claims

# Keeps the speedup figures in the README and benchmark docs tied to the committed raw data.

on:
  pull_request:
    paths:
      - "README.md"
      - "benchmarks/**"
      - ".github/workflows/benchmark-claims.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "benchmarks/**"
      - ".github/workflows/benchmark-claims.yml"

permissions:
  contents: read

jobs:
  check:
    name: Documented speedups match the raw data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recompute the quoted ratios
        run: python3 benchmarks/check_claims.py
