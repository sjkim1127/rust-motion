name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Formatting & Clippy Lints ─────────────────────────────────────
  fmt_clippy:
    name: Code Quality (Fmt & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --locked --workspace --all-targets --all-features

  # ── 2. Cross-Platform Unit & Integration Tests ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: fmt_clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libssl-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Prepare TypeScript build directory
        run: mkdir -p crates/ts/dist

      - name: Cargo Check Workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run All Workspace Tests
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --exclude rust-motion-python

      # FFmpeg-backed tests share process-level environment and temporary
      # resources on Windows. Keep the same coverage serial, but split the
      # targets so a stalled integration test cannot hide unit-test progress.
      - name: Run Workspace Unit Tests (Windows, serial)
        if: runner.os == 'Windows'
        run: cargo test --locked --workspace --exclude rust-motion-python --lib --bins -- --test-threads=1

      - name: Run Workspace Integration Tests (Windows, serial)
        if: runner.os == 'Windows'
        run: cargo test --locked --workspace --exclude rust-motion-python --tests -- --test-threads=1

      - name: Test GPU scene compilation without device initialization
        run: 'cargo test --locked -p rust-motion-rasterizer --features gpu support_tests::'

  # ── 3. TypeScript SDK and Remotion Bridge tests ───────────────────────────
  typescript_sdk:
    name: TypeScript SDK & Remotion Bridge
    runs-on: ubuntu-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TypeScript Tests
        run: |
          node --test crates/ts/tests/*.test.mjs
