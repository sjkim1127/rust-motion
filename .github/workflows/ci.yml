name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Formatting & Clippy Lints ─────────────────────────────────────
  fmt_clippy:
    name: Code Quality (Fmt & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # ── 2. Cross-Platform Unit & Integration Tests ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: fmt_clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libssl-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Cargo Check Workspace
        run: cargo check --locked --workspace --all-targets --all-features

      # Test output is also the Sentry defect evidence (docs/sentry.md);
      # bash runs with pipefail, so cargo's exit code still decides the step.
      - name: Run All Workspace Tests
        shell: bash
        run: |
          mkdir -p ci-evidence
          cargo test --locked --workspace --exclude rust-motion-python 2>&1 | tee -a ci-evidence/cargo-test.log

      - name: Test GPU scene compilation without device initialization
        shell: bash
        run: |
          cargo test --locked -p rust-motion-rasterizer --features gpu support_tests:: 2>&1 | tee -a ci-evidence/cargo-test.log

      - name: Upload defect evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentry-evidence-test-${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'macos' || 'windows' }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # ── 2b. CI scripts (Sentry defect reporter; docs/sentry.md) ───────────────
  ci_scripts:
    name: CI Scripts (Sentry defect reporter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run CI script tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  # ── 3. TypeScript SDK and Remotion Bridge tests ───────────────────────────
  typescript_sdk:
    name: TypeScript SDK & Remotion Bridge
    runs-on: ubuntu-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run TypeScript Tests
        run: |
          node --test crates/ts/tests/*.test.mjs

      - name: Verify npm package distribution
        run: |
          cd crates/ts
          npm pack --dry-run

  # ── 4. WebAssembly Engine & Browser Canvas ────────────────────────────────
  wasm:
    name: WebAssembly (WASM Engine & Browser Canvas)
    runs-on: ubuntu-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check WASM target
        run: cargo check --locked -p rust-motion-wasm --target wasm32-unknown-unknown

      - name: Run WASM crate native unit tests
        run: cargo test --locked -p rust-motion-wasm

  # ── Sentry defect events (docs/sentry.md) ─────────────────────────────────
  # Report-only: never on pull requests, forks or tags, and never changes the
  # run's result. SENTRY_DSN reaches only the reporter job.
  sentry_defects:
    name: Sentry defects
    needs: [test]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sjkim1127/rust-motion'
    permissions:
      contents: read
    uses: ./.github/workflows/sentry-defects.yml
    secrets:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
