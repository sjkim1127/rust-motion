name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Formatting & Clippy Lints ─────────────────────────────────────
  fmt_clippy:
    name: Code Quality (Fmt & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      # Fails if a version-bearing file changes shape and the release script no longer matches it.
      - name: Release script matches the repository
        run: python3 scripts/release/prepare.py 99.0.0 --dry-run > /dev/null

      - name: Run Clippy Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # ── 2. Cross-Platform Unit & Integration Tests ──────────────────────────────
  test:
    # `label` keeps the check names stable ("Test (ubuntu-latest)", ...) because branch
    # protection requires them, while `os` pins the actual runner image.
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-24.04
          - label: macos-latest
            os: macos-15
          - label: windows-latest
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - name: Cargo Check Workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest runs test binaries in parallel instead of one after another. It cannot list
      # `harness = false` targets, and it does not run doctests, so both are run separately below.
      - name: Run All Workspace Tests
        run: cargo nextest run --locked --workspace --exclude rust-motion-python --no-fail-fast -E 'not binary(monitor_macos)'

      - name: Run tests with a custom harness
        run: cargo test --locked -p rust-motion-tablet --test monitor_macos

      - name: Run doc tests
        run: cargo test --locked --workspace --exclude rust-motion-python --doc

      - name: Test GPU scene compilation without device initialization
        run: 'cargo test --locked -p rust-motion-rasterizer --features gpu support_tests::'

  # ── 3. TypeScript SDK and Remotion Bridge tests ───────────────────────────
  typescript_sdk:
    name: TypeScript SDK & Remotion Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run TypeScript Tests
        run: |
          node --test crates/ts/tests/*.test.mjs

      - name: Verify npm package distribution
        run: |
          cd crates/ts
          npm pack --dry-run

  # ── 4. WebAssembly Engine & Browser Canvas ────────────────────────────────
  wasm:
    name: WebAssembly (WASM Engine & Browser Canvas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Check WASM target
        run: cargo check --locked -p rust-motion-wasm --target wasm32-unknown-unknown

      - name: Run WASM crate native unit tests
        run: cargo test --locked -p rust-motion-wasm
