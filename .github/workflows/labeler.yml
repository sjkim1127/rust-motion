name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs with write access, so this job never checks out or
# executes pull-request code: it only reads the labeler config from the base branch.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
