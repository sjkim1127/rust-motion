name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Only one visual run per branch/PR at a time
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render_snapshots:
    name: Render Visual Snapshots (HelloWorld)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Needs write permission to post PR comments
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libssl-dev

      - name: Build rust-motion-cli (release)
        run: cargo build --locked -p rust-motion-cli --release

      - name: Create snapshots directory
        run: mkdir -p snapshots

      # Render multi-scene golden gallery (9 frames across 4 compositions).
      # Every snapshot is attempted and its exit code recorded as Sentry defect
      # evidence (docs/sentry.md); the step fails afterwards if any render did.
      - name: Render snapshots
        shell: bash
        run: |
          mkdir -p ci-evidence
          failed=0
          entries=()
          while read -r composition frame name; do
            code=0
            ./target/release/rust-motion render \
              --composition "$composition" \
              --frame-start "$frame" --frame-end "$frame" \
              --output "snapshots/${name}.png" \
              --codec png --width 960 --height 540 </dev/null || code=$?
            entries+=("{\"snapshot\": \"${name}.png\", \"exit_code\": ${code}}")
            if [[ "$code" -ne 0 ]]; then
              echo "::error::render of ${name} exited with ${code}"
              failed=1
            fi
          done <<'RENDERS'
          HelloWorld 0 hello_world_0000
          HelloWorld 30 hello_world_0030
          HelloWorld 90 hello_world_0090
          ShapesAndFilters 0 shapes_filters_0000
          ShapesAndFilters 30 shapes_filters_0030
          CyberpunkGrid 0 cyberpunk_grid_0000
          CyberpunkGrid 30 cyberpunk_grid_0030
          ComplexGradients 0 complex_gradients_0000
          ComplexGradients 30 complex_gradients_0030
          RENDERS
          (IFS=,; printf '{"version": 1, "renders": [%s]}\n' "${entries[*]}") > ci-evidence/render-status.json
          exit "$failed"

      - name: Verify snapshots were created
        run: |
          for f in snapshots/*.png; do
            if [[ ! -f "$f" ]]; then
              echo "::error::No snapshots found in snapshots/"
              exit 1
            fi
            size=$(stat -c%s "$f")
            echo "✓ $f (${size} bytes)"
          done

      - name: Verify visual regression against golden frames
        run: |
          python3 -m pip install --upgrade pillow numpy
          python3 tests/compare_visual_golden.py --actual-dir snapshots --golden-dir tests/visual_golden \
            --report-json ci-evidence/visual-report.json

      - name: Upload snapshots artifact
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-${{ github.sha }}
          path: snapshots/
          retention-days: 30
          if-no-files-found: error

      # Post or update a single comment on the PR with artifact links
      - name: Post PR comment with snapshot links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha       = context.sha.substring(0, 7);
            const runId     = context.runId;
            const { owner, repo } = context.repo;
            const runUrl    = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const artifactUrl = `${runUrl}#artifacts`;

            // Get the workspace version from Cargo.toml for the badge
            const { execSync } = require('child_process');
            let version = '0.2.0';
            try {
              version = execSync(
                "cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == \"rust-motion-cli\") | .version'",
                { encoding: 'utf8' }
              ).trim();
            } catch (_) {}

            const body = [
              '## 🎬 Visual Regression Snapshots — Multi-Scene Gallery',
              '',
              `Rendered **9 frames across 4 compositions** at 960 × 540 from commit \`${sha}\`.`,
              '',
              '| Scene | Frame | Timestamp (30 fps) | Features Tested |',
              '|:------|:-----:|:-------------------|:----------------|',
              '| **HelloWorld** | 0 | 0.0 s | Bundled typography, linear gradient, circles |',
              '| **HelloWorld** | 30 | 1.0 s | Dynamic text, expanding progress bar |',
              '| **HelloWorld** | 90 | 3.0 s | Fully expanded progress bar |',
              '| **ShapesAndFilters** | 0 | 0.0 s | Rounded rects, SVG star, drop shadow, vignette |',
              '| **ShapesAndFilters** | 30 | 1.0 s | Animated transform, blur filter, vignette |',
              '| **CyberpunkGrid** | 0 | 0.0 s | Perspective grid lines, neon glow shadow |',
              '| **CyberpunkGrid** | 30 | 1.0 s | Horizon offset, pulsing neon, chromatic aberration |',
              '| **ComplexGradients** | 0 | 0.0 s | 4-stop linear gradient, dual radial gradients |',
              '| **ComplexGradients** | 30 | 1.0 s | Rotated linear gradient, pulsating radial gradients |',
              '',
              `📦 **[Download all 9 PNGs](${artifactUrl})**`,
              `> Artifact: \`visual-snapshots-${context.sha}\` · login required to download`,
              '',
              `🔗 [View full CI run](${runUrl})`,
              `_Rendered on Ubuntu 22.04 · rust-motion-cli v${version}_`,
            ].join('\n');

            // Upsert — find an existing bot comment and update it, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const MARKER = '🎬 Visual Regression Snapshots';
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing PR comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created new PR comment #${created.id}`);
            }

      # Upload log on failure for debugging render issues
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-logs-${{ github.sha }}
          path: |
            snapshots/
            /tmp/rust-motion-render-*.log
          retention-days: 7

      - name: Upload defect evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentry-evidence-visual-linux
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # ── Sentry defect events (docs/sentry.md) ─────────────────────────────────
  # Report-only: never on pull requests, forks or tags, and never changes the
  # run's result. SENTRY_DSN reaches only the reporter job.
  sentry_defects:
    name: Sentry defects
    needs: [render_snapshots]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sjkim1127/rust-motion'
    permissions:
      contents: read
    uses: ./.github/workflows/sentry-defects.yml
    secrets:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
