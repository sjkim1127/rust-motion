name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Only one visual run per branch/PR at a time
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render_snapshots:
    name: Render Visual Snapshots (HelloWorld)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Needs write permission to post PR comments
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build rust-motion-cli (release)
        run: cargo build --locked -p rust-motion-cli --release

      - name: Create snapshots directory
        run: mkdir -p snapshots

      # Render multi-scene golden gallery (9 frames across 4 compositions)
      - name: Render snapshots
        run: |
          ./target/release/rust-motion render \
            --composition HelloWorld \
            --frame-start 0 --frame-end 0 \
            --output snapshots/hello_world_0000.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition HelloWorld \
            --frame-start 30 --frame-end 30 \
            --output snapshots/hello_world_0030.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition HelloWorld \
            --frame-start 90 --frame-end 90 \
            --output snapshots/hello_world_0090.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition ShapesAndFilters \
            --frame-start 0 --frame-end 0 \
            --output snapshots/shapes_filters_0000.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition ShapesAndFilters \
            --frame-start 30 --frame-end 30 \
            --output snapshots/shapes_filters_0030.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition CyberpunkGrid \
            --frame-start 0 --frame-end 0 \
            --output snapshots/cyberpunk_grid_0000.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition CyberpunkGrid \
            --frame-start 30 --frame-end 30 \
            --output snapshots/cyberpunk_grid_0030.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition ComplexGradients \
            --frame-start 0 --frame-end 0 \
            --output snapshots/complex_gradients_0000.png \
            --codec png --width 960 --height 540

          ./target/release/rust-motion render \
            --composition ComplexGradients \
            --frame-start 30 --frame-end 30 \
            --output snapshots/complex_gradients_0030.png \
            --codec png --width 960 --height 540

      - name: Verify snapshots were created
        run: |
          for f in snapshots/*.png; do
            if [[ ! -f "$f" ]]; then
              echo "::error::No snapshots found in snapshots/"
              exit 1
            fi
            size=$(stat -c%s "$f")
            echo "✓ $f (${size} bytes)"
          done

      - name: Verify visual regression against golden frames
        run: |
          python3 -m pip install --upgrade pillow numpy
          python3 tests/compare_visual_golden.py --actual-dir snapshots --golden-dir tests/visual_golden

      - name: Upload snapshots artifact
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-${{ github.sha }}
          path: snapshots/
          retention-days: 30
          if-no-files-found: error

      # Post or update a single comment on the PR with artifact links
      - name: Post PR comment with snapshot links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha       = context.sha.substring(0, 7);
            const runId     = context.runId;
            const { owner, repo } = context.repo;
            const runUrl    = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const artifactUrl = `${runUrl}#artifacts`;

            // Get the workspace version from Cargo.toml for the badge
            const { execSync } = require('child_process');
            let version = '0.2.0';
            try {
              version = execSync(
                "cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == \"rust-motion-cli\") | .version'",
                { encoding: 'utf8' }
              ).trim();
            } catch (_) {}

            const body = [
              '## 🎬 Visual Regression Snapshots — Multi-Scene Gallery',
              '',
              `Rendered **9 frames across 4 compositions** at 960 × 540 from commit \`${sha}\`.`,
              '',
              '| Scene | Frame | Timestamp (30 fps) | Features Tested |',
              '|:------|:-----:|:-------------------|:----------------|',
              '| **HelloWorld** | 0 | 0.0 s | Bundled typography, linear gradient, circles |',
              '| **HelloWorld** | 30 | 1.0 s | Dynamic text, expanding progress bar |',
              '| **HelloWorld** | 90 | 3.0 s | Fully expanded progress bar |',
              '| **ShapesAndFilters** | 0 | 0.0 s | Rounded rects, SVG star, drop shadow, vignette |',
              '| **ShapesAndFilters** | 30 | 1.0 s | Animated transform, blur filter, vignette |',
              '| **CyberpunkGrid** | 0 | 0.0 s | Perspective grid lines, neon glow shadow |',
              '| **CyberpunkGrid** | 30 | 1.0 s | Horizon offset, pulsing neon, chromatic aberration |',
              '| **ComplexGradients** | 0 | 0.0 s | 4-stop linear gradient, dual radial gradients |',
              '| **ComplexGradients** | 30 | 1.0 s | Rotated linear gradient, pulsating radial gradients |',
              '',
              `📦 **[Download all 9 PNGs](${artifactUrl})**`,
              `> Artifact: \`visual-snapshots-${context.sha}\` · login required to download`,
              '',
              `🔗 [View full CI run](${runUrl})`,
              `_Rendered on Ubuntu 22.04 · rust-motion-cli v${version}_`,
            ].join('\n');

            // Upsert — find an existing bot comment and update it, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const MARKER = '🎬 Visual Regression Snapshots';
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing PR comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created new PR comment #${created.id}`);
            }

      # Upload log on failure for debugging render issues
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-logs-${{ github.sha }}
          path: |
            snapshots/
            /tmp/rust-motion-render-*.log
          retention-days: 7
