name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish. Leave empty to dry-run the selected branch.
        required: false
        type: string
      dry_run:
        description: Verify and build everything, but publish nothing.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Prepare TypeScript build directory
        run: mkdir -p crates/ts/dist

      - name: Verify tag matches workspace version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rust-motion-cli") | .version')
          release_tag="$RELEASE_TAG"
          if [[ "$DRY_RUN" == "true" && -z "$INPUT_TAG" ]]; then
            # Dry run of a branch: check the versions agree with each other.
            release_tag="v${package_version}"
          fi
          tag_version="${release_tag#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $release_tag does not match workspace version $package_version"
            exit 1
          fi

          ts_version=$(jq -r '.version' crates/ts/package.json)
          python_version=$(awk -F '"' '/^version = / {print $2; exit}' crates/python/pyproject.toml)
          for artifact in "TypeScript:$ts_version" "Python:$python_version"; do
            artifact_name="${artifact%%:*}"
            artifact_version="${artifact#*:}"
            if [[ "$artifact_version" != "$tag_version" ]]; then
              echo "::error::$artifact_name version $artifact_version does not match tag $tag_version"
              exit 1
            fi
          done

      - name: Verify publish file lists
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < .github/release-crates.txt
          metadata_packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[]
              | select(.source == null and (.name | startswith("rust-motion-")))
              | select(.publish == null or (.publish | length > 0))
              | .name' \
            | sort)
          configured_packages=$(printf '%s\n' "${packages[@]}" | sort)
          if [[ "$configured_packages" != "$metadata_packages" ]]; then
            echo "::error::The crates.io release list does not match publishable workspace packages"
            diff -u <(printf '%s\n' "$metadata_packages") <(printf '%s\n' "$configured_packages") || true
            exit 1
          fi
          for package in "${packages[@]}"; do
            cargo package --locked --list -p "$package" >/dev/null
          done

      # fmt, clippy and the test suite already ran in CI for this exact commit; require that
      # run to be green instead of repeating it here and only finding out after tagging.
      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require green CI on the tagged commit
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/require-ci
        with:
          sha: ${{ steps.commit.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish_crates:
    name: Publish crates.io packages
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Publish packages in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::Repository secret CRATES_IO_TOKEN is not configured"
            exit 1
          fi

          version="${RELEASE_TAG#v}"

          crate_is_published() {
            local package="$1"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --user-agent "Rust Motion-release/${version} (+https://github.com/sjkim1127/Rust Motion)" \
              "https://crates.io/api/v1/crates/${package}/${version}" \
              >/dev/null 2>&1
          }

          publish_package() {
            local package="$1"

            for attempt in $(seq 1 40); do
              if crate_is_published "$package"; then
                echo "${package}@${version} is already published; skipping"
                return 0
              fi

              echo "Publishing ${package}@${version} (attempt ${attempt}/40)"
              if cargo publish --locked -p "$package"; then
                return 0
              fi
              if [[ "$attempt" -eq 40 ]]; then
                echo "::error::Failed to publish ${package}@${version}"
                return 1
              fi
              sleep 30
            done
          }

          packages=()
          while IFS= read -r package; do packages+=("$package"); done < .github/release-crates.txt

          for package in "${packages[@]}"; do
            publish_package "$package"
          done

  build_release:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset_name: rust-motion-cli-linux-x86_64.tar.gz
            binary_name: rust-motion

          - target: aarch64-apple-darwin
            os: macos-15
            asset_name: rust-motion-cli-macos-aarch64.tar.gz
            binary_name: rust-motion

          - target: x86_64-apple-darwin
            os: macos-15
            asset_name: rust-motion-cli-macos-x86_64.tar.gz
            binary_name: rust-motion

          - target: x86_64-pc-windows-msvc
            os: windows-2025
            asset_name: rust-motion-cli-windows-x86_64.zip
            binary_name: rust-motion.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked -p rust-motion-cli --release --features rhai --target ${{ matrix.target }}

      - name: Package asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C target/${{ matrix.target }}/release \
            -czf ${{ matrix.asset_name }} \
            ${{ matrix.binary_name }}

      - name: Package asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} `
            -DestinationPath ${{ matrix.asset_name }}

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  github_release:
    name: Create GitHub Release
    needs:
      - publish_crates
      - build_release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
