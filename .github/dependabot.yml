version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /crates/ts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript, "area:typescript"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /benchmarks/remotion
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, javascript]
    # These packages must share one version, so each family moves in a single pull request.
    # Security updates need their own group: version-update groups do not apply to them, and a
    # security update that raised only @remotion/bundler is what broke the benchmark before.
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
      remotion-security:
        applies-to: security-updates
        patterns: ["remotion", "@remotion/*"]
      react:
        patterns: ["react", "react-dom"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom"]
  - package-ecosystem: pip
    directory: /crates/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, "area:python"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, "area:ci"]
    groups:
      actions:
        patterns: ["*"]
