[package]
name = "rust-motion-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
rust-motion-geom = { workspace = true }
rust-motion-color = { workspace = true }
rust-motion-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
