[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dioxuscut"
version = "0.3.0"
description = "High-performance browser-free programmatic video rendering engine for Python"
readme = "README.md"
authors = [{ name = "Dioxuscut Contributors" }]
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "video",
    "remotion",
    "rust",
    "animation",
    "motion-graphics",
    "rendering",
    "ffmpeg",
    "compositing",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/sjkim1127/rust-motion"
Documentation = "https://github.com/sjkim1127/rust-motion#readme"
Repository = "https://github.com/sjkim1127/rust-motion"
Issues = "https://github.com/sjkim1127/rust-motion/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "dioxuscut._dioxuscut"
