[package]
name = "rust-motion-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python native bindings for Rust Motion programmatic video engine"
repository = "https://github.com/sjkim1127/rust-motion"
readme = "README.md"
publish = false

[lib]
name = "_rust_motion"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

rust-motion-animation = { workspace = true }
rust-motion-captions = { workspace = true, default-features = false }
rust-motion-cli = { workspace = true, features = ["rhai"] }
rust-motion-composition = { workspace = true }
rust-motion-media = { workspace = true, default-features = false }
rust-motion-paths = { workspace = true }
rust-motion-rasterizer = { workspace = true }
rust-motion-shapes = { workspace = true, default-features = false }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
