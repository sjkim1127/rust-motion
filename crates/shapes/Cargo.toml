[package]
name        = "rust-motion-shapes"
description = "Procedural SVG shapes for Rust Motion — Circle, Rect, Star, Triangle, Polygon, Pie, Arrow"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus              = { workspace = true, optional = true }
rust-motion-animation = { workspace = true }
rust-motion-composition = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
rust-motion-paths     = { workspace = true }

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus"]
