[package]
name        = "rust-motion-core"
description = "Core Dioxus components and hooks for Rust Motion — Composition, Sequence, AbsoluteFill, etc."
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus                = { workspace = true }
rust-motion-animation   = { workspace = true }
rust-motion-composition = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
web-sys            = { version = "0.3", features = ["Window", "Location"] }

[features]
default = []
web     = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
dioxus-ssr = "0.6"
