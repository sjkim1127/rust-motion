[package]
name = "rust-motion-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["testgen", "serde"]
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
rust-motion-color = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rust_motion_psd = { path = ".", package = "rust-motion-psd", features = ["testgen"] }

[lints]
workspace = true
