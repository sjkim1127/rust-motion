[package]
name        = "rust-motion-rasterizer"
description = "Native CPU/GPU rasterizer for browser-free Rust Motion frame rendering"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
thiserror  = { workspace = true }
image      = { workspace = true }
tiny-skia  = { workspace = true }
resvg      = { workspace = true, default-features = false }
ab_glyph   = { workspace = true }
rustybuzz  = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
base64     = { workspace = true }
urlencoding = { workspace = true }
rayon      = { workspace = true }
tracing    = { workspace = true }
tempfile   = { workspace = true }
rasterlottie = { version = "0.2.2", default-features = false }
symphonia  = { workspace = true }
rust-motion-color = { workspace = true }
rust-motion-psd   = { workspace = true }
rust-motion-geom  = { workspace = true }
rust-motion-raster = { workspace = true }
rust-motion-paint = { workspace = true }
rust-motion-tablet = { workspace = true }
rust-motion-doc    = { workspace = true }
rust-motion-vector = { workspace = true }
rust-motion-affinity = { workspace = true }
rust-motion-algo     = { workspace = true }
rust-motion-plugins  = { workspace = true }
wgpu       = { version = "22", optional = true }
pollster   = { version = "0.4", optional = true }
lyon_tessellation = { workspace = true, optional = true }

[features]
default = []
# Enable wgpu GPU-accelerated offscreen rendering
gpu = ["wgpu", "pollster", "lyon_tessellation"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_bench"
harness = false
required-features = []
