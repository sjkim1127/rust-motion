description = "Native D3 and Mermaid chart and diagram generator for Rust Motion using QuickJS"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[lib]
name = "rust_motion_charts"
path = "src/lib.rs"

[dependencies]
