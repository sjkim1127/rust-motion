[package]
name        = "rust-motion-media"
description = "Media components for Rust Motion — Img, Video, Audio"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus             = { workspace = true, optional = true }
rust-motion-core     = { workspace = true, optional = true }
rust-motion-composition = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
rust-motion-audio-dsp   = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
hound              = { workspace = true }
image              = { workspace = true }
symphonia          = { workspace = true }
thiserror          = { workspace = true }

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus", "dep:rust-motion-core"]
