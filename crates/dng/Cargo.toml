[package]
name = "rust-motion-dng"
description = "Clean-room DNG / CinemaDNG camera RAW decoder (TIFF container, lossless JPEG, DNG colour pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["threads", "writer"]
threads = ["dep:rayon"]
# A small DNG and lossless JPEG writer for synthesising test files.
writer = []

[dependencies]
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
rust-motion-dng = { path = ".", features = ["writer"] }
