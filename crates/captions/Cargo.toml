[package]
name        = "rust-motion-captions"
description = "Subtitle parsing (SRT), word timing, and kinetic captions for Rust Motion"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus              = { workspace = true, optional = true }
rust-motion-core      = { workspace = true, optional = true }
rust-motion-composition = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus", "dep:rust-motion-core"]
