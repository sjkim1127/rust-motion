[package]
name        = "rust-motion-cli"
description = "CLI tool for rendering Rust Motion compositions headlessly"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[lib]
name = "rust_motion_cli"
path = "src/lib.rs"

[[bin]]
name = "rust-motion"
path = "src/main.rs"

[dependencies]
rust-motion-animation   = { workspace = true }
rust-motion-composition = { workspace = true }
rust-motion-media       = { workspace = true, default-features = false }
rust-motion-paths       = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
rust-motion-shapes      = { workspace = true, default-features = false }
rust-motion-charts      = { workspace = true }
rust-motion-project     = { workspace = true }
clap               = { version = "4.4", features = ["derive", "env"] }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
rhai               = { workspace = true, optional = true }
axum               = { workspace = true, features = ["ws"] }
tower-http         = { workspace = true }
image              = { workspace = true }
notify             = "6"
base64             = { workspace = true }
taffy              = { workspace = true }

[dev-dependencies]
rust-motion-renderer = { workspace = true }
reqwest            = { workspace = true }
serde_json         = { workspace = true }
filetime           = "0.2"
futures-util       = "0.3"
tempfile           = { workspace = true }
tokio-tungstenite   = "0.24"

[[test]]
name    = "e2e_cli_subprocess"
harness = true

[features]
default = ["rhai"]
gpu     = ["rust-motion-rasterizer/gpu"]
rhai    = ["dep:rhai"]
