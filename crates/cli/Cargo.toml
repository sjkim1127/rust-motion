[package]
name        = "dioxuscut-cli"
description = "CLI tool for rendering Dioxuscut compositions headlessly"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[lib]
name = "dioxuscut_cli"
path = "src/lib.rs"

[[bin]]
name = "dioxuscut"
path = "src/main.rs"

[dependencies]
dioxuscut-animation   = { workspace = true }
dioxuscut-composition = { workspace = true }
dioxuscut-media       = { workspace = true, default-features = false }
dioxuscut-paths       = { workspace = true }
dioxuscut-rasterizer  = { workspace = true }
dioxuscut-shapes      = { workspace = true, default-features = false }
dioxuscut-charts      = { workspace = true }
dioxuscut-project     = { workspace = true }
clap               = { version = "4.4", features = ["derive"] }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
rhai               = { workspace = true, optional = true }
axum               = { workspace = true, features = ["ws"] }
tower-http         = { workspace = true }
image              = { workspace = true }
notify             = "6"
base64             = { workspace = true }
taffy              = { workspace = true }

[dev-dependencies]
dioxuscut-renderer = { workspace = true }
reqwest            = { workspace = true }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
filetime           = "0.2"

[[test]]
name    = "e2e_cli_subprocess"
harness = true

[features]
default = ["rhai"]
gpu     = ["dioxuscut-rasterizer/gpu"]
rhai    = ["dep:rhai"]
