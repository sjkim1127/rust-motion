[package]
name        = "rust-motion-player"
description = "Interactive video player component for Rust Motion"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
dioxus             = { workspace = true }
rust-motion-core      = { workspace = true }
rust-motion-animation = { workspace = true }
rust-motion-composition = { workspace = true }
rust-motion-rasterizer  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
# The player only needs the timer runtime. Keeping Tokio's default/full
# networking features out of the wasm graph avoids pulling mio, which has no
# browser socket backend.
tokio              = { version = "1", default-features = false, features = ["rt", "time"] }
